<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奄美クイズに挑戦！</title>
    <!-- 共通のスタイルシートを読み込み -->
    <link rel="stylesheet" href="style.css?v=2026">
    <style>
        .quiz-scroll-area {
            width: 100%;
            flex: 1;
            overflow-y: auto;
            margin: 15px 0;
            padding-right: 4px;
        }
        .quiz-scroll-area::-webkit-scrollbar {
            width: 4px;
        }
        .quiz-scroll-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }
        .quiz-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 20px 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            margin-bottom: 15px;
        }
        .question-text {
            font-size: 16px;
            line-height: 1.6;
            color: #ffffff;
            margin-bottom: 12px;
            text-align: left;
            font-weight: 500;
        }
        .question-text-en {
            font-size: 12px;
            line-height: 1.5;
            color: #94a3b8;
            margin-bottom: 25px;
            text-align: left;
            font-style: italic;
        }
        .quiz-choice-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 10px;
        }
        .quiz-ox-btn {
            display: block;
            width: 100%;
            padding: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .quiz-ox-btn:active {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            transform: scale(0.96);
        }
        .result-message {
            font-size: 16px;
            font-weight: bold;
            margin: 15px 0;
            color: #38bdf8;
        }
        .quiz-meta {
            font-size: 12px;
            color: #38bdf8;
            margin-bottom: 12px;
            text-align: left;
            font-weight: bold;
            letter-spacing: 0.05em;
        }
        .quiz-menu-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 5px;
        }
        .quiz-menu-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        .quiz-menu-btn:active {
            background: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
            transform: scale(0.98);
        }
        .quiz-menu-icon {
            font-size: 28px;
            margin-right: 15px;
            width: 35px;
            text-align: center;
        }
        .quiz-menu-title {
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
        }
        .quiz-menu-desc {
            font-size: 11px;
            color: #64748b;
            margin-top: 3px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 動的に書き換わるヘッダータイトル -->
        <header class="brand-header">
            <h1 class="brand-logo" id="mainTitle" style="font-size: 22px; letter-spacing: 0.1em;">奄美クイズ</h1>
            <p class="brand-sub" id="subTitle">▲ えらんで ちょうせんしよう！ ▲</p>
        </header>

        <div class="quiz-scroll-area">
            
            <!-- 4つのクイズ選択メニュー -->
            <div id="quizMenu" class="quiz-card">
                <div class="quiz-menu-group">
                    <!-- 1. 世界自然遺産クイズ -->
                    <button class="quiz-menu-btn" onclick="selectQuiz('heritage')">
                        <span class="quiz-menu-icon">🌳</span>
                        <div>
                            <div class="quiz-menu-title">世界自然遺産クイズ</div>
                            <div class="quiz-menu-desc">奄美の貴重ないきものや大自然のひみつ</div>
                        </div>
                    </button>
                    <!-- 2. 瀬戸内検定（○×） -->
                    <a href="./kentei2.html" class="quiz-menu-btn" style="text-decoration: none;">
                        <span class="quiz-menu-icon">🛶</span>
                        <div>
                            <div class="quiz-menu-title">瀬戸内検定</div>
                            <div class="quiz-menu-desc">私たちのまち、瀬戸内町の歴史と文化（〇×）</div>
                        </div>
                    </a>
                    <!-- 3. 瀬戸内検定 三択 -->
                    <a href="./kentei3.html" class="quiz-menu-btn" style="text-decoration: none;">
                        <span class="quiz-menu-icon">🎯</span>
                        <div>
                            <div class="quiz-menu-title">瀬戸内検定 三択</div>
                            <div class="quiz-menu-desc">3つの選択肢から選ぶおなじみクイズ（郷土料理など）</div>
                        </div>
                    </a>
                    <!-- 4. 瀬戸内検定 画像 -->
                    <a href="./kentei4.html" class="quiz-menu-btn" style="text-decoration: none;">
                        <span class="quiz-menu-icon">📸</span>
                        <div>
                            <div class="quiz-menu-title">瀬戸内検定 画像</div>
                            <div class="quiz-menu-desc">写真を見て答えるビジュアルクイズ</div>
                        </div>
                    </a>
                </div>
            </div>
            
            <!-- クイズプレイ画面 -->
            <div id="quizPlay" class="quiz-card" style="display: none;">
                <div class="quiz-meta" id="quizProgress">もんだい 1 / 全 10 問</div>
                <div class="question-text" id="questionText">読み込み中...</div>
                <div class="question-text-en" id="questionTextEn">Loading...</div>
                
                <div class="quiz-choice-group">
                    <button class="quiz-ox-btn" onclick="checkAnswer(true)">〇</button>
                    <button class="quiz-ox-btn" onclick="checkAnswer(false)">×</button>
                </div>
                
                <div id="resultMessage" class="result-message"></div>
                <button id="nextBtn" class="modal-close-btn" style="display: none; margin-top: 15px;" onclick="nextQuestion()">つぎの問題へ 👉</button>
            </div>

            <!-- 結果発表画面のボタン -->
            <div id="quizResult" class="quiz-card" style="display: none;">
                <h3 style="color: #ffffff; font-size: 18px; margin-bottom: 10px;">🎉 クイズおわり！</h3>
                <p id="scoreText" style="font-size: 15px; color: #cbd5e1; margin-bottom: 20px;">10問中 8問 正解でした！</p>
                <p id="gradeText" style="font-size: 13px; color: #38bdf8; font-weight: bold; margin-bottom: 20px; line-height: 1.5;"></p>
                <button class="nav-btn" style="margin-bottom: 10px; width: 100%; background: rgba(56, 189, 248, 0.1); border-color: #38bdf8;" onclick="backToQuizMenu()">🗺️ クイズメニューにもどる</button>
                <button class="nav-btn" style="width: 100%;" onclick="startQuiz()">🔄 もう一度このクイズに挑戦する！</button>
            </div>
        </div>

        <!-- 【★大修正】画面の一番下にある固定ボタンの文字を「🏠 ホームへもどる」に変更し、リンク先もトップ画面（index.html）へ直通するように復復させました！ -->
        <div class="back-home-wrap">
            <a href="index.html" class="nav-btn back-home-btn" id="footerLinkBtn" style="display: block; text-decoration: none; width: 100%;">🏠 ホームへもどる</a>
        </div>
    </div>

    <!-- ここで別室のクイズデータ（quiz-data.js）を電波リンク！ -->
    <script src="quiz-data.js?v=2026"></script>
    <script>
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedQuestions = [];
        const TOTAL_QUESTIONS = 10;

        window.onload = function() {
            backToQuizMenu();
        };

        // クイズ選択メニュー画面に戻る処理
        function backToQuizMenu() {
            document.getElementById('mainTitle').innerText = "奄美クイズ";
            document.getElementById('subTitle').innerText = "▲ えらんで ちょうせんしよう！ ▲";
            document.getElementById('quizMenu').style.display = 'block';
            document.getElementById('quizPlay').style.display = 'none';
            document.getElementById('quizResult').style.display = 'none';

            // 【動的連動】メニュー画面のときは、一番下のボタンを「ホームへもどる(index.html)」にします
            const footerBtn = document.getElementById('footerLinkBtn');
            if (footerBtn) {
                footerBtn.innerText = "🏠 ホームへもどる";
                footerBtn.href = "index.html";
                // buttonの挙動をリンク(aタグ)本来の動きに戻す
                footerBtn.setAttribute("onclick", ""); 
            }
        }

        // 世界自然遺産クイズが選ばれたときの処理
        function selectQuiz(type) {
            document.getElementById('mainTitle').innerText = "世界自然遺産クイズ";
            document.getElementById('subTitle').innerText = "▲ クイズに ちょうせん中！ ▲";

            // 【動的連動】クイズ本編が始まったら、一番下のボタンを「メニューにもどる」に切り替えます
            const footerBtn = document.getElementById('footerLinkBtn');
            if (footerBtn) {
                footerBtn.innerText = "⬅ クイズメニューにもどる";
                footerBtn.href = "javascript:void(0);"; // ページ遷移を止める
                footerBtn.setAttribute("onclick", "backToQuizMenu()"); // クリックでメニューに戻す
            }

            startQuiz();
        }

        function startQuiz() {
            let sourceQuestions = typeof heritageQuestions !== 'undefined' ? heritageQuestions : [];
            
            if (sourceQuestions.length === 0) {
                alert("クイズデータがまだ準備されていないか、読み込めていません。");
                backToQuizMenu();
                return;
            }

            // シャッフルして10問を贅沢に切り出す
            let shuffled = [...sourceQuestions].sort(() => 0.5 - Math.random());
            selectedQuestions = shuffled.slice(0, TOTAL_QUESTIONS);
            
            currentQuestionIndex = 0;
            score = 0;

            document.getElementById('quizMenu').style.display = 'none';
            document.getElementById('quizPlay').style.display = 'block';
            document.getElementById('quizResult').style.display = 'none';

            showQuestion();
        }

        function showQuestion() {
            const currentQ = selectedQuestions[currentQuestionIndex];

            document.getElementById('quizProgress').innerText = `もんだい ${currentQuestionIndex + 1} / 全 ${TOTAL_QUESTIONS} 問`;
            document.getElementById('questionText').innerText = currentQ.ja;
            document.getElementById('questionTextEn').innerText = currentQ.en || '';
            document.getElementById('resultMessage').innerText = '';
            document.getElementById('nextBtn').style.display = 'none';

            const buttons = document.getElementsByClassName('quiz-ox-btn');
            for(let btn of buttons) { btn.disabled = false; }
        }

        function checkAnswer(userChoice) {
            const currentQ = selectedQuestions[currentQuestionIndex];
            const buttons = document.getElementsByClassName('quiz-ox-btn');
            for(let btn of buttons) { btn.disabled = true; }

            const resultMsg = document.getElementById('resultMessage');

            if (userChoice === currentQ.a) {
                resultMsg.innerText = "⭕️ せいかい！ / CORRECT";
                resultMsg.style.color = "#38bdf8";
                score++;
            } else {
                resultMsg.innerText = "❌ まちがい！ / INCORRECT";
                resultMsg.style.color = "#ef4444";
            }

            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < TOTAL_QUESTIONS) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quizPlay').style.display = 'none';
            document.getElementById('quizResult').style.display = 'block';

            document.getElementById('scoreText').innerText = `10問中、 ${score}問 せいかいでした！`;

            const gradeText = document.getElementById('gradeText');
            const rate = score / TOTAL_QUESTIONS;

            if (rate === 1) {
                gradeText.innerText = "🐶「パーフェクトワン！きみは今日からかんぺきなマスターだね！🐾」";
            } else if (rate >= 0.7) {
                gradeText.innerText = "🛶「すごいすごい！奄美のことがとっても大好きなんだね！」";
            } else {
                gradeText.innerText = "🌿「おしい！これでお出かけすれば、もっと奄美の山や海がおもしろくなるよ！」";
            }
        }

        function openComingSoon(quizName) {
            alert(`「${quizName}」の部屋は、ただいま相棒のジョッキー君と一緒にバキバキに構築しています！お楽しみに 🐶🐾`);
        }
    </script>
</body>
</html>
