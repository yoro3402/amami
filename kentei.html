<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奄美クイズに挑戦！</title>
    <!-- 1. 共通のスタイルシートを読み込み -->
    <link rel="stylesheet" href="style.css?v=2026">
    <!-- 2. 【新設】クイズ画面専用のスタイルシートを読み込み -->
    <link rel="stylesheet" href="kentei-style.css?v=2026">
</head>
<body>

    <div class="container">
        <!-- 動的に書き換わるヘッダータイトル -->
        <header class="brand-header">
            <h1 class="brand-logo" id="mainTitle" style="font-size: 22px; letter-spacing: 0.1em;">奄美クイズ</h1>
            <p class="brand-sub" id="subTitle">▲ えらんで ちょうせんしよう！ ▲</p>
        </header>

        <div class="quiz-scroll-area">
            
            <!-- 4つのクイズ選択メニュー -->
            <div id="quizMenu" class="quiz-card">
                <div class="quiz-menu-group">
                    <!-- 1. 世界自然遺産クイズ -->
                    <button class="quiz-menu-btn" onclick="selectQuiz('heritage')">
                        <span class="quiz-menu-icon">🌳</span>
                        <div>
                            <div class="quiz-menu-title">世界自然遺産クイズ</div>
                            <div class="quiz-menu-desc">奄美の貴重ないきものや大自然のひみつ</div>
                        </div>
                    </button>
                    <!-- 2. 瀬戸内検定（○×） -->
                    <a href="./kentei2.html" class="quiz-menu-btn" style="text-decoration: none;">
                        <span class="quiz-menu-icon">🛶</span>
                        <div>
                            <div class="quiz-menu-title">瀬戸内検定</div>
                            <div class="quiz-menu-desc">私たちのまち、瀬戸内町の歴史と文化（〇×）</div>
                        </div>
                    </a>
                    <!-- 3. 瀬戸内検定 三択 -->
                    <a href="./kentei3.html" class="quiz-menu-btn" style="text-decoration: none;">
                        <span class="quiz-menu-icon">🎯</span>
                        <div>
                            <div class="quiz-menu-title">瀬戸内検定 三択</div>
                            <div class="quiz-menu-desc">3つの選択肢から選ぶおなじみクイズ（郷土料理など）</div>
                        </div>
                    </a>
                    <!-- 4. 瀬戸内検定 画像 -->
                    <a href="./kentei4.html" class="quiz-menu-btn" style="text-decoration: none;">
                        <span class="quiz-menu-icon">📸</span>
                        <div>
                            <div class="quiz-menu-title">瀬戸内検定 画像</div>
                            <div class="quiz-menu-desc">写真を見て答えるビジュアルクイズ</div>
                        </div>
                    </a>
                </div>
            </div>
            
            <!-- クイズプレイ画面 -->
            <div id="quizPlay" class="quiz-card" style="display: none;">
                <div class="quiz-meta" id="quizProgress">もんだい 1 / 全 10 問</div>
                <div class="question-text" id="questionText">読み込み中...</div>
                <div class="question-text-en" id="questionTextEn">Loading...</div>
                
                <div class="quiz-choice-group">
                    <button class="quiz-ox-btn" onclick="checkAnswer(true)">〇</button>
                    <button class="quiz-ox-btn" onclick="checkAnswer(false)">×</button>
                </div>
                
                <div id="resultMessage" class="result-message"></div>
                <button id="nextBtn" class="modal-close-btn" style="display: none; margin-top: 15px;" onclick="nextQuestion()">つぎの問題へ 👉</button>
            </div>

            <!-- 結果発表画面のボタン -->
            <div id="quizResult" class="quiz-card" style="display: none;">
                <h3 style="color: #ffffff; font-size: 18px; margin-bottom: 10px;">🎉 クイズおわり！</h3>
                <p id="scoreText" style="font-size: 15px; color: #cbd5e1; margin-bottom: 20px;">10問中 8問 正解でした！</p>
                <p id="gradeText" style="font-size: 13px; color: #38bdf8; font-weight: bold; margin-bottom: 20px; line-height: 1.5;"></p>
                <button class="nav-btn" style="margin-bottom: 10px; width: 100%; background: rgba(56, 189, 248, 0.1); border-color: #38bdf8;" onclick="backToQuizMenu()">🗺️ クイズメニューにもどる</button>
                <button class="nav-btn" style="width: 100%;" onclick="startQuiz()">🔄 もう一度このクイズに挑戦する！</button>
            </div>
        </div>

        <!-- 一番下の固定ボタンエリア（セーフエリア付きで絶対に隠れません） -->
        <div class="back-home-wrap">
            <a href="index.html" class="nav-btn back-home-btn" id="footerLinkBtn" style="display: block; text-decoration: none; width: 100%;">🏠 ホームへもどる</a>
        </div>
    </div>

    <!-- 3. 別室のクイズデータ（quiz-data.js）を電波リンク -->
    <script src="quiz-data.js?v=2026"></script>
    <!-- 4. 【新設】クイズ画面専用のプログラムロジックを読み込み -->
    <script src="kentei-script.js?v=2026"></script>
</body>
</html>
