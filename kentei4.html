<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瀬戸内検定(画像入り3択版) - AMAMI NATURE CLUB</title>
    <!-- 1. 全体共通のスタイルシートを読み込み -->
    <link rel="stylesheet" href="style.css?v=2026">
    <!-- 2. 【新設】画像クイズ専用のスタイルシートを別室から読み込み -->
    <link rel="stylesheet" href="kentei4-style.css?v=2026">
</head>
<body>

    <div class="container">
        <!-- 動的に書き換わるヘッダータイトル -->
        <header class="brand-header">
            <h1 class="brand-logo" id="mainTitle">瀬戸内検定</h1>
            <p class="brand-sub" id="subTitle">▲ 写真を見て三択クイズに挑戦！ ▲</p>
        </header>

        <!-- クイズプレイ画面 -->
        <div id="quizPlay" class="quiz-card">
            <div class="quiz-meta" id="quizProgress">もんだい 1 / 全 10 問</div>
            
            <!-- 写真表示エリア -->
            <div class="quiz-image-area">
                <img id="quizImage" src="" alt="クイズ写真">
            </div>

            <div class="question-text" id="questionText">読み込み中...</div>
            
            <div class="choice-list">
                <button class="btn-choice" id="choice1" onclick="answerKentei(1)">① 選択肢 1</button>
                <button class="btn-choice" id="choice2" onclick="answerKentei(2)">② 選択肢 2</button>
                <button class="btn-choice" id="choice3" onclick="answerKentei(3)">③ 選択肢 3</button>
            </div>
            
            <div id="resultMark" class="result-mark"></div>
        </div>

        <!-- 結果発表画面（クリア後に露出） -->
        <div id="quizResult" class="quiz-card" style="display: none;">
            <h3 style="color: #ffffff; font-size: 18px; margin-bottom: 10px;">🎉 クイズおわり！</h3>
            <p id="scoreText" style="font-size: 15px; color: #cbd5e1; margin-bottom: 20px;">10問中 0問 正解でした！</p>
            <p id="gradeText" style="font-size: 13px; color: #38bdf8; font-weight: bold; margin-bottom: 20px; line-height: 1.5;"></p>
            <button class="btn-choice" style="text-align: center; background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: white; border: none; margin-bottom: 12px;" onclick="startKentei()">🔄 もう一度挑戦する！</button>
        </div>

        <!-- 一番下の固定ボタンエリア（すき間を凝縮） -->
        <div class="back-home-wrap">
            <a href="kentei.html" class="nav-btn" style="display: block; text-decoration: none; width: 100%; text-align: center;">⬅ クイズメニューにもどる</a>
        </div>
    </div>

    <!-- 3. 別室のクイズデータ（quiz-data4.js）を電波リンク -->
    <script src="quiz-data4.js?v=2026_okuda_perfect_vfinal_fix3"></script>
    <!-- 4. 【新設】画像クイズ専用のプログラムロジックを別室から読み込み -->
    <script src="kentei4-script.js?v=2026_okuda_perfect_vfinal_fix3"></script>
</body>
</html>
