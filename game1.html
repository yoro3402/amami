<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝さがしゲーム - AMAMI WEB CREATIVE</title>
    <link rel="stylesheet" href="style.css?v=2026">
    <style>
        body {
            background: linear-gradient(135deg, #060b14 0%, #0a1120 100%) !important;
            font-family: "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .game-container {
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 15px 10px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        h1 {
            color: #ffffff;
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            font-weight: 700;
        }

        .game-intro {
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.5;
            margin: 0 0 10px 0;
        }

        .game-highlight {
            color: #f43f5e;
            font-weight: bold;
        }

        .game-controls {
            margin-bottom: 12px;
        }

        .game-btn-reset {
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
            background-color: #ea580c;
            color: white;
            border: none;
            border-radius: 6px;
            transition: 0.2s;
            font-weight: bold;
        }

        .game-btn-reset:active {
            background-color: #c2410c;
            transform: scale(0.96);
        }

        /* 【画面切れ防止】画面幅に合わせて綺麗に伸縮する超高精度グリッド */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(9, minmax(25px, 1fr));
            gap: 3px;
            background-color: rgba(255, 255, 255, 0.05);
            max-width: 340px;
            width: 100%;
            margin: 0 auto 15px auto;
            padding: 6px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
        }

        .game-cell {
            aspect-ratio: 1 / 1;
            background-color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s, transform 0.1s;
            border-radius: 4px;
        }

        .game-cell.treasure {
            background-color: #eab308 !important;
            color: #1e1b4b !important;
            font-size: 16px;
            animation: gameFound 1s infinite alternate;
        }

        @keyframes gameFound {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }

        .btn-footer-nav {
            display: inline-flex;
            gap: 10px;
            justify-content: center;
            margin-top: 5px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            padding: 8px 14px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-back:active {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🗺️ 宝さがしゲーム</h1>
        <p class="game-intro">
            マスをタップして宝を探そう！<br>
            外れても、<span class="game-highlight">宝に近いほど赤く（熱く）</span>なるよ！
        </p>

        <div class="game-controls">
            <button class="game-btn-reset" onclick="resetGame()">もう一度遊ぶ</button>
        </div>

        <!-- 宝さがしゲームのグリッド -->
        <div class="game-grid" id="gameGrid"></div>

        <!-- 下部ナビゲーションボタン群 -->
        <div class="btn-footer-nav">
            <a href="game.html" class="btn-back">⬅ ゲｰム選択へ戻る</a>
            <a href="index.html" class="btn-back">🏠 ﾎｰﾑへ戻る</a>
        </div>
    </div>

    <script>
        const gameGrid = document.getElementById('gameGrid');
        let treasureLocation;
        let gameOver = false;
        const maxDistance = calculateDistance(1, 81);

        function initGame() {
            gameGrid.innerHTML = "";
            gameOver = false;
            treasureLocation = Math.floor(Math.random() * 81) + 1;

            for (let i = 1; i <= 81; i++) {
                const cell = document.createElement('div');
                cell.classList.add('game-cell');
                cell.id = 'game-cell-' + i;
                cell.textContent = i;
                cell.addEventListener('click', () => digCell(i));
                gameGrid.appendChild(cell);
            }
        }

        function digCell(val) {
            if (gameOver) return;

            const targetCell = document.getElementById('game-cell-' + val);
            if (targetCell.style.backgroundColor && targetCell.id !== 'game-cell-' + treasureLocation) {
                return;
            }

            if (val === treasureLocation) {
                targetCell.textContent = "👑";
                targetCell.classList.add('treasure');
                setTimeout(() => {
                    alert("🎉おめでとう！宝ものを見つけました！🎉");
                }, 500);
                gameOver = true;
                return;
            }

            const distance = calculateDistance(val, treasureLocation);
            const colorIntensity = 1 - (distance / maxDistance);
            const hue = 240 - (colorIntensity * 240);

            targetCell.style.backgroundColor = `hsl(${hue}, 80%, 40%)`;
            targetCell.style.color = "#ffffff";
            targetCell.textContent = "×";
        }

        function calculateDistance(p1, p2) {
            const x1 = (p1 - 1) % 9;
            const y1 = Math.floor((p1 - 1) / 9);
            const x2 = (p2 - 1) % 9;
            const y2 = Math.floor((p2 - 1) / 9);
            return Math.sqrt(Math.pow(x1 - x2, 2) + Math.pow(y1 - y2, 2));
        }

        function resetGame() {
            initGame();
        }

        initGame();
    </script>
</body>
</html>
