<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハノイの塔 - AMAMI WEB CREATIVE</title>
    <!-- 共通スタイルシートを読み込み -->
    <link rel="stylesheet" href="style.css?v=2026">
    <style>
        /* Webクリエイティブ専用の、知的でサイバー感のある深い海のグラデーション背景 */
        body {
            background: linear-gradient(135deg, #060b14 0%, #0a1120 100%) !important;
            font-family: "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .game-container-wrapper {
            max-width: 440px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px 10px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        h1 {
            color: #ffffff;
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            font-weight: 700;
        }

        .game-intro {
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.5;
            margin: 0 0 15px 0;
        }

        /* 以前の手数・枚数情報をスタイリッシュにアレンジ */
        .info-panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-around;
            font-size: 13px;
            color: #cbd5e1;
        }

        .status-val {
            font-weight: bold;
            color: #38bdf8;
            font-size: 15px;
        }

        /* お祝いメッセージ表示エリア（ガタつき防止の最小高さ設定） */
        .message-area {
            min-height: 40px;
            color: #38bdf8;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 15px;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 以前のボタンをさらに洗練させた配置構造 */
        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            min-height: 38px; /* ボタン未出現時のレイアウト維持用 */
        }

        .btn {
            padding: 8px 16px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: none; /* 初期は非表示 */
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-next {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        .btn-home {
            background: #475569;
            color: white;
        }

        /* スマホの画面幅に合わせて「100%はみ出さずに自動縮小」するゲーム盤ステージ */
        .game-board {
            display: flex;
            justify-content: space-around;
            height: 180px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 8px solid #475569;
            border-radius: 8px 8px 4px 4px;
            padding: 10px 5px 0 5px;
            position: relative;
            align-items: flex-end;
            box-sizing: border-box;
        }

        /* 3本の柱 */
        .peg {
            width: 32%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            box-sizing: border-box;
            z-index: 3;
            padding-bottom: 2px;
        }

        /* 以前の柱（木製）の美しさをサイバー風に昇華 */
        .peg::before {
            content: '';
            position: absolute;
            bottom: 0;
            width: 8px;
            height: 140px;
            background: #475569;
            border-radius: 4px 4px 0 0;
            z-index: 1;
        }

        /* ディスクの共通スタイル（以前の丸みを帯びた美しいデザインを踏襲） */
        .disk {
            height: 20px;
            border-radius: 10px;
            z-index: 2;
            margin-bottom: 2px;
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            cursor: grab;
            transition: visibility 0s;
        }
        .disk:active {
            cursor: grabbing;
        }

        /* 下部ナビゲーションボタン */
        .btn-footer-nav {
            display: inline-flex;
            gap: 10px;
            justify-content: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
            width: 100%;
        }
        .btn-nav-link {
            display: inline-flex;
            align-items: center;
            padding: 8px 14px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-nav-link:active {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="game-container-wrapper">
        <h1>🗼 ハノイの塔</h1>
        <p class="game-intro">
            【スマホ対応】移動させる「皿のある柱」をタップし、次に「移動先の柱」をタップしてね。<br>小さい皿の上に大きいものは置けません。
        </p>

        <!-- 以前と同じ手数・枚数管理インジケーター -->
        <div class="info-panel">
            <div>ディスク数: <span id="disk-count" class="status-val">3</span> 枚</div>
            <div>手数: <span id="moves" class="status-val">0</span> 手</div>
        </div>

        <!-- お祝いメッセージ表示エリア -->
        <div class="message-area" id="message"></div>

        <!-- 以前と同じ連動仕様のステップアップボタン群 -->
        <div class="button-container">
            <button class="btn btn-next" id="btn-next">🚀 次に挑戦しますか？</button>
            <button class="btn btn-home" id="btn-home">🏠 最初の3枚に戻る</button>
        </div>

        <!-- スマホ幅を考慮したパズルステージ -->
        <div class="game-board">
            <div class="peg" id="peg1" onclick="selectPeg(1)"></div>
            <div class="peg" id="peg2" onclick="selectPeg(2)"></div>
            <div class="peg" id="peg3" onclick="selectPeg(3)"></div>
        </div>

        <div class="btn-footer-nav">
            <a href="game.html" class="btn-nav-link">⬅ ゲーム選択へ戻る</a>
            <a href="index.html" class="btn-nav-link">🏠 ホームへ戻る</a>
        </div>
    </div>

    <!-- 100%独立動作するタップ型レベルアップ制御ロジック -->
    <script>
        // ディスクの色リスト（以前の美しさをそのまま最大8枚まで自動対応）
        const colors = [
            '#ff4757', '#ffa502', '#2ed573', '#1e90ff', 
            '#9b59b6', '#34495e', '#1abc9c', '#e67e22'
        ];

        // 3本の柱のデータを二次元配列で完全仮想管理（1=小 〜 8=大）
        let pegsData = { 1: [], 2: [], 3: [] };
        let currentDiskCount = 3; 
        let movesCount = 0;
        let selectedPegId = null; // 1回目にタップされた柱のIDを一時保管
        let gameOver = false;

        const movesDisplay = document.getElementById('moves');
        const diskCountDisplay = document.getElementById('disk-count');
        const messageDisplay = document.getElementById('message');
        const btnNext = document.getElementById('btn-next');
        const btnHome = document.getElementById('btn-home');

        // ゲームの初期化・リセット関数
        function initGame(diskAmount) {
            currentDiskCount = diskAmount;
            movesCount = 0;
            selectedPegId = null;
            gameOver = false;
            
            movesDisplay.textContent = movesCount;
            diskCountDisplay.textContent = currentDiskCount;
            messageDisplay.textContent = '一番上のディスクを選んで動かしてね 🐾';
            messageDisplay.style.color = '#cbd5e1'; 
            
            btnNext.style.display = 'none';
            btnHome.style.display = 'none';

            // 配列データの初期化
            pegsData[1] = [];
            pegsData[2] = [];
            pegsData[3] = [];

            // 指定された枚数のディスク数値を1番目の柱へ大きい順（下から）積む
            for (let i = currentDiskCount; i >= 1; i--) {
                pegsData[1].push(i);
            }

            renderBoard();
        }

        // 柱のデータを基に画面を美しく同期・再描写する数理アルゴリズム
        function renderBoard() {
            // 枚数が増えても柱の高さ（140px）を決してはみ出さないよう、皿の厚みを動的計算
            const diskHeight = Math.min(24, Math.floor(130 / currentDiskCount));

            for (let p = 1; p <= 3; p++) {
                const pegElement = document.getElementById(`peg${p}`);
                pegElement.innerHTML = '';

                // タップ選択されている柱に、前半新設の「発光ハイライト」を同期
                if (selectedPegId === p) {
                    pegElement.classList.add('selected');
                } else {
                    pegElement.classList.remove('selected');
                }

                // データを基に、スマホに最適化された綺麗な階段状のディスクを物理生成
                pegsData[p].forEach(diskSize => {
                    const disk = document.createElement('div');
                    disk.classList.add('disk');
                    
                    // 奥田様の幅計算比率をレスポンシブ％へ完全最適化
                    const widthPercent = 30 + (diskSize * (60 / currentDiskCount));
                    disk.style.width = `${widthPercent}%`;
                    disk.style.height = `${diskHeight}px`;
                    disk.style.background = colors[(diskSize - 1) % colors.length];

                    pegElement.appendChild(disk);
                });
            }
        }

        // 柱がタップされた時の高精度コントロールプログラム（ドラッグからの大改修）
        function selectPeg(pegId) {
            if (gameOver) return;

            // 【1回目のタップ】移動元の柱を選択
            if (selectedPegId === null) {
                if (pegsData[pegId].length === 0) {
                    messageDisplay.textContent = '⚠️ その柱には動かせるディスクがありません！';
                    messageDisplay.style.color = '#f43f5e';
                    return;
                }
                selectedPegId = pegId;
                messageDisplay.textContent = '🔮 次に「移動させたい先の柱」をタップしてください。';
                messageDisplay.style.color = '#38bdf8';
                renderBoard();
            } 
            // 【2回目のタップ】移動先の柱を選択
            else {
                // 同じ柱を2回叩いた場合は選択キャンセル
                if (selectedPegId === pegId) {
                    selectedPegId = null;
                    messageDisplay.textContent = '移動をキャンセルしました。皿のある柱を選んでね。';
                    messageDisplay.style.color = '#cbd5e1';
                    renderBoard();
                    return;
                }

                const fromPeg = pegsData[selectedPegId];
                const toPeg = pegsData[pegId];
                const movingDiskSize = fromPeg[fromPeg.length - 1]; // 動かす皿のサイズ
                const targetTopDiskSize = toPeg[toPeg.length - 1];   // 移動先の一番上の皿のサイズ

                // 鉄のハノイルール判定（小さい皿の上に大きい皿は置けない）
                if (toPeg.length > 0 && targetTopDiskSize < movingDiskSize) {
                    alert('⚠️ 小さいディスクの上に大きいディスクは置けません！');
                    selectedPegId = null; // 選択状態を解除
                    renderBoard();
                    return;
                }

                // 正常な配列移動処理
                toPeg.push(fromPeg.pop());
                movesCount++;
                movesDisplay.textContent = movesCount;
                messageDisplay.textContent = '👍 綺麗に移動できました！';
                messageDisplay.style.color = '#10b981';

                selectedPegId = null; // 選択を解除して再描写
                renderBoard();

                // クリア判定（2番目、または3番目の柱の配列数が揃ったら勝利！）
                if (pegsData[2].length === currentDiskCount || pegsData[3].length === currentDiskCount) {
                    checkWin();
                }
            }
        }

        // クリア判定（お祝いメッセージとステップアップボタン出現の完全再現）
        function checkWin() {
            gameOver = true;
            // 数学的理論値（2^n - 1）の最小手数をバキバキに計算
            const minMoves = Math.pow(2, currentDiskCount) - 1;
            
            if (movesCount === minMoves) {
                messageDisplay.innerHTML = `🎉 よくできました！！ (${movesCount}手で最小クリア！数学的センスが抜群です！🐶🐾)`;
            } else {
                messageDisplay.innerHTML = `🎉 クリアおめでとう！！ (${movesCount}手でクリア！最小手数は ${minMoves}手 だよ 🐾)`;
            }
            messageDisplay.style.color = '#38bdf8'; 
            
            // クリア後にボタンを100%バキバキに出現させる仕様をそのまま踏襲
            btnNext.style.display = 'block';
            btnHome.style.display = 'block';
            
            // 以前と同様の、スマホ視野を助ける親切なアラート誘導
            setTimeout(() => {
                alert(`🎉 ステージクリア！\n画面の上部に「次に挑戦しますか？」ボタンが出現しました！`);
            }, 150);
        }

        // ボタンのクリックイベント（レベルアップ制御の完全統合）
        btnNext.addEventListener('click', () => {
            if (currentDiskCount >= 8) {
                alert('すごいです！最大レベル（8枚）までクリアしました！最初の3枚に戻ります。');
                initGame(3);
            } else {
                initGame(currentDiskCount + 1);
            }
        });

        btnHome.addEventListener('click', () => {
            initGame(3);
        });

        // 最初にゲームを自動起動
        initGame(3);
    </script>
