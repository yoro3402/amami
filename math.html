<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中学校数学に挑戦 | AMAMI WEB CREATIVE</title>
    <!-- 共通の高級感ある洗練された黒ベースデザインを適用 -->
    <link rel="stylesheet" href="style.css?v=2026">
    <style>
        /* 数学ページ専用の微調整スタイル */
        .math-menu-title {
            text-align: center;
            color: #f8fafc;
            margin-bottom: 25px;
            font-size: 1.2rem;
            letter-spacing: 0.1em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ヘッダーロゴ -->
        <header class="brand-header">
            <h1 class="brand-logo">AMAMI WEB CREATIVE</h1>
            <p class="brand-sub">Mathematics Challenge Room</p>
        </header>

        <!-- メインコンテンツエリア -->
        <main style="width: 100%; max-width: 500px; margin: 0 auto;">
            
            <!-- 選択メニュー画面 -->
            <div id="mathMenu">
                <h2 class="math-menu-title">📐 中学校数学に挑戦</h2>
                <nav class="main-nav" style="gap: 12px;">
                    <!-- 選択アイコン1: 正負の数の計算 -->
                    <button class="nav-btn" onclick="startQuiz('seifu')">🔢 正負の数の計算</button>
                    <!-- 選択アイコン2: 文字式の計算 -->
                    <button class="nav-btn" onclick="startQuiz('moji')">✖ 文字式の計算</button>
                    <!-- 選択アイコン3: モンティ・ホール問題 -->
                    <button class="nav-btn" onclick="startQuiz('monty')">🚪 モンティ・ホール問題</button>
                    
                    <!-- トップページに戻るリンクボタン -->
                    <button class="nav-btn" onclick="goToHome()" style="margin-top: 15px; border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.02); color: #94a3b8;">🏠 トップページへ戻る</button>
                </nav>
            </div>

        </main>

        <!-- コピーライト -->
        <footer class="brand-footer" style="margin-top: 40px;">
            <p>&copy; AMAMI WEB CREATIVE</p>
        </footer>
    </div>

    <!-- 100%完全独立動作・安全ジャンププログラム -->
    <script>
        // 各アイコンをクリックしたときにそれぞれのフォルダのindex.htmlへジャンプする関数
        function startQuiz(key) {
            if (key === 'seifu') {
                window.location.href = "seifu-calc/index.html";
            } else if (key === 'moji') {
                window.location.href = "moji-calc/index.html";
            } else if (key === 'monty') {
                window.location.href = "monthy/index.html";
            }
        }

        // トップページ（index.html）に戻る関数
        function goToHome() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
